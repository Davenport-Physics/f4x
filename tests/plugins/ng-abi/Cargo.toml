[package]
name = "f4x-ng-abi-test"
description = "Next-gen F4SE plugin ABI test: a declarative (F4SEPlugin_Version) plugin with Preload and Load that records what its host gives it"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "f4x_ng_abi"
crate-type = ["cdylib"]

[dependencies]
f4x-abi = { path = "../../../crates/f4x-abi" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# Also export F4SEPlugin_Query (a plugin built for both generations).
query = []
# Old-gen shape only: F4SEPlugin_Query + F4SEPlugin_Load, no version data, no Preload.
legacy = []

[lints]
workspace = true
