[package]
name = "f4x-probe"
description = "Black-box probe: an F4SE plugin that records what its host does"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "f4x_probe"
crate-type = ["cdylib"]

[dependencies]
f4x-abi = { path = "../../crates/f4x-abi" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints]
workspace = true
