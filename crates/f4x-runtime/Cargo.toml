[package]
name = "f4x-runtime"
description = "The f4x runtime DLL injected into Fallout4.exe"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "f4x_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
f4x-abi = { path = "../f4x-abi" }
f4x-agent = { path = "../f4x-agent" }
f4x-engine = { path = "../f4x-engine" }
f4x-proto = { path = "../f4x-proto" }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
