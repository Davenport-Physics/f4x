[package]
name = "f4x-pextool"
description = "CLI for BA2 listing/extraction and .pex dumping and round-trip checks"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "f4x-pextool"
path = "src/main.rs"

[dependencies]
f4x-ba2 = { path = "../f4x-ba2" }
f4x-pex = { path = "../f4x-pex" }
f4x-host = { path = "../f4x-host" }
glob = "0.3"
serde_json = "1"

[lints]
workspace = true
